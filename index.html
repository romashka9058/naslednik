        <meta name="keywords" content="Ильяс, биография, Нигерия, Россия, африка, стендоффер, вор в загоне, наследник, игра, пабг, бравл, африка, африканский лидер, инвестиции, экономика, онлайн-казино, мотивация, бизнес, стартап, шахта, кубометры, лидерборд, африканская философия, мотивационные видео, международная корпорация, африканские технологии, кинотеатр, фильм, эмоциональная нестабильность, потеря мотивации, ложное ощущение, ложные решения, скрытые смыслы, скрытые надписи, скрытые конфликты, скрытые долги, скрытые спан элементы, африканский континент, африканская культура, африканская история, африканские лидеры, африканские инвестиции, африканская экономика, африканские проекты, африканские технологии, африканские инновации, африканские стартапы, африканские бизнесы, африканские корпорации, африканские компании, африканские предприниматели, африканские инвесторы, африканские миллиардеры">

        <meta property="og:image" content="https://romashka9058.github.io/naslednik/media/22.webp">
        <link rel="icon" type="image/png" href="./media/icon.webp">
        <title>Биография</title>
    </head>
    <body>

        <style>
            #app {
                z-index: 100;
                position: fixed;
                bottom: 0;
                right: -75dvw; 
                max-width: 75dvw;
                max-height: 50dvh;
                min-width: 30dvw;
                transition: right 1s;
            }

            #app.show {
                right: 0;
            }
        </style>

        <iframe id="frame" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;" src="https://romashka9058.github.io/naslednik/main.html"></iframe>
        <img src="./media/app.webp" id="app">
        


        <script>
            const element = document.getElementById('app');

            element.addEventListener('click', (event) => {
                event.stopPropagation(); 
                window.location.href = 'https://github.com/romashka9058/heir/releases/tag/app';
            });

            function getRandomTime(min, max) {
                return Math.floor(Math.random() * (max - min + 1) + min) * 1000;
            }

            function startEvent() {
                const delay = getRandomTime(15, 25);

                setTimeout(() => {
                    const audio = new Audio('./media/vasapmaiboi.mp3');
                    audio.play().catch(error => {
                        console.warn("Звук заблокирован браузером, но картинка выдвигается:", error);
                    });

                    element.classList.add('show');

                    setTimeout(() => {
                        element.classList.remove('show');
                    }, 12000);

                }, delay);
            }

            window.addEventListener('DOMContentLoaded', () => {
                startEvent();
            });
        </script>

    </body>
</html>
